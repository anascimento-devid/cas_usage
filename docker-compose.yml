services:

  api:
    build: .
    container_name: bank-marketing-api
    ports:
      - "8000:8000"
    environment:
      - MONITORING_DIR=/app/monitoring
    volumes:
        - ./monitoring:/app/monitoring

  ui:
    build:
      context: .
      dockerfile: Dockerfile.ui
    container_name: bank-marketing-ui
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://api:8000
      - MONITORING_DIR=/app/monitoring
    volumes:
        - ./monitoring:/app/monitoring
    depends_on:
      - api